<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CODE FORCE - SIH 2026 Logistics Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-black min-h-screen">
  <div id="root"></div>

    const { useState, useEffect } = React;

    function App() {

      const [vehicleAge, setVehicleAge] = useState(4);
      const [isEV, setIsEV] = useState(true);

          <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-6 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">

                { id: 'live', label: '2. Live Operations', icon: 'fa-tower-observation' },
                { id: 'compliance', label: '3. Fleet Compliance (<7 Yrs)', icon: 'fa-shield-halved' },
                { id: 'tech', label: '4. Optimization & Data', icon: 'fa-network-wired' },

                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  class={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                    activeTab === tab.id
                      ? 'bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/20'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'

                  <i class={`fa-solid ${tab.icon}`}></i>

          <main class="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
            
            {/* Pitch Tab */}
            {activeTab === 'pitch' && (
              <div class="space-y-6 animate-fadeIn">
                <div class="p-8 rounded-2xl bg-gradient-to-r from-slate-900 via-slate-900 to-slate-950 border border-slate-800 shadow-xl relative overflow-hidden">
                  <div class="absolute -right-10 -bottom-10 w-60 h-60 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

                  <div class="p-5 rounded-xl bg-slate-900 border border-slate-800">
                    <i class="fa-solid fa-train-subway text-cyan-400 text-2xl mb-3"></i>
                    <h3 class="font-bold text-white mb-1">Macro Rail Integration</h3>

                  <div class="p-5 rounded-xl bg-slate-900 border border-slate-800">
                    <i class="fa-solid fa-road text-cyan-400 text-2xl mb-3"></i>
                    <h3 class="font-bold text-white mb-1">7.0–7.3m Median Corridors</h3>
                    <p class="text-xs text-slate-400">Repurposed 2-lane median transit lanes dedicated strictly to compliant zero-emission or young fleet vehicles.</p>

                </div>
              </div>

            {/* Live Operations Tab */}
            {activeTab === 'live' && (
              <div class="space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div class="lg:col-span-2 p-5 rounded-xl bg-slate-900 border border-slate-800 space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                      <h3 class="font-bold text-white text-sm flex items-center gap-2">
                        <i class="fa-solid fa-satellite-dish text-cyan-400"></i> Macro Spine & Arterial Median Monitor
                      </h3>
                      <span class="flex items-center gap-2 text-xs text-emerald-400 font-mono">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> ULIP Active
                      </span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                      <div class="p-4 rounded-lg bg-slate-950 border border-slate-800/80">
                        <div class="text-xs text-slate-400">WDFC Rail Corridor</div>
                        <div class="text-xl font-bold text-white font-mono mt-1">78.4 km/h</div>
                        <div class="text-xs text-cyan-400 mt-1">Avg Freight Velocity</div>
                      </div>
                      <div class="p-4 rounded-lg bg-slate-950 border border-slate-800/80">
                        <div class="text-xs text-slate-400">7.2m Arterial Median Lane</div>
                        <div class="text-xl font-bold text-white font-mono mt-1">42.1 km/h</div>
                        <div class="text-xs text-emerald-400 mt-1">Congestion Free Transit</div>

                    <div class="p-4 rounded-lg bg-slate-950 border border-slate-800 space-y-2">

                        <span class="text-[10px] px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30 font-mono">

                      </div>
                      <div class="relative aspect-video rounded-lg bg-slate-950 border border-slate-800 flex items-center justify-center overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-60"></div>
                        <i class="fa-solid fa-truck-fast text-slate-700 text-4xl"></i>
                        <div class="absolute top-2 left-2 px-2 py-1 bg-black/80 rounded text-[10px] font-mono text-cyan-400">
                          CAM-MEDIAN-04 • 1080p 60fps
                        </div>
                        <div class="absolute bottom-2 left-2 right-2 flex justify-between text-[11px] font-mono bg-black/80 p-2 rounded border border-slate-800">
                          <span class="text-emerald-400">Zero-Velocity Alert: OFF</span>
                          <span class="text-slate-400">Latency: 14ms</span>
                        </div>
                      </div>
                    </div>
                    <div class="mt-4 p-3 rounded bg-slate-950 border border-slate-800/80 text-xs text-slate-400">
                      <i class="fa-solid fa-shield-cat text-cyan-400 mr-1"></i> Autonomous &lt;3s stoppage & invasion alert active.
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Compliance Simulator Tab */}
            {activeTab === 'compliance' && (
              <div class="p-6 rounded-xl bg-slate-900 border border-slate-800 space-y-6">
                <div>
                  <h3 class="text-lg font-bold text-white mb-1">Vahan 4.0 Median Transit Validator</h3>
                  <p class="text-xs text-slate-400">Strict Jury Requirement: Vehicles accessing 7.0–7.3m median priority corridors must be EVs or under 7 years old.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div class="space-y-4 p-5 rounded-lg bg-slate-950 border border-slate-800">
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-1">Vehicle Registration Number</label>
                      <input 
                        type="text" 
                        value={regNum}
                        onChange={(e) => setRegNum(e.target.value)}
                        class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm font-mono text-white focus:outline-none focus:border-cyan-500"
                      />
                    </div>

                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-1">Vehicle Age: {vehicleAge} Years</label>
                      <input 
                        type="range" 
                        min="0" 
                        max="15" 
                        value={vehicleAge}
                        onChange={(e) => setVehicleAge(Number(e.target.value))}
                        class="w-full accent-cyan-500 cursor-pointer"
                      />
                      <div class="flex justify-between text-[10px] text-slate-500 font-mono mt-1">
                        <span>New</span>
                        <span>7 Years Limit</span>
                        <span>15 Years</span>
                      </div>
                    </div>

                    <div class="flex items-center gap-3 pt-2">
                      <input 
                        type="checkbox" 
                        id="evCheck" 
                        checked={isEV}
                        onChange={(e) => setIsEV(e.target.checked)}
                        class="w-4 h-4 accent-cyan-500 rounded cursor-pointer"
                      />
                      <label htmlFor="evCheck" class="text-xs font-semibold text-slate-300 cursor-pointer">
                        Electric Vehicle (EV Status)
                      </label>
                    </div>
                  </div>

                  {/* Validation Result Box */}
                  <div class={`p-6 rounded-lg border flex flex-col items-center justify-center text-center space-y-3 ${
                    isEligible 
                      ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-400' 
                      : 'bg-rose-950/30 border-rose-500/40 text-rose-400'
                  }`}>
                    <i class={`fa-solid ${isEligible ? 'fa-circle-check' : 'fa-circle-xmark'} text-5xl`}></i>
                    <h4 class="text-xl font-bold font-mono tracking-wide">
                      {isEligible ? 'ACCESS GRANTED' : 'ACCESS DENIED'}
                    </h4>
                    <p class="text-xs text-slate-300 max-w-xs leading-relaxed">
                      {isEligible 
                        ? `Vehicle ${regNum} meets transit criteria (${isEV ? 'EV Authorized' : `${vehicleAge} yrs old < 7 yrs limit`}).` 
                        : `Vehicle ${regNum} is ${vehicleAge} years old and Non-EV. Exceeds the 7-year age limit.`}
                    </p>
                  </div>
                </div>
              </div>
            )}

            {/* Tech & Optimization Tab */}
            {activeTab === 'tech' && (
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="p-5 rounded-xl bg-slate-900 border border-slate-800 space-y-4">
                  <h3 class="font-bold text-white text-sm">National Data Proxy Integration</h3>
                  <div class="space-y-3 text-xs font-mono">
                    {[
                      { name: 'ULIP (Unified Logistics Interface)', status: 'Connected', code: '200 OK' },
                      { name: 'FOIS (Freight Operations Info System)', status: 'Connected', code: '200 OK' },
                      { name: 'Vahan 4.0 Registration DB', status: 'Active', code: '200 OK' },
                      { name: 'FASTag Toll Network', status: 'Active', code: '200 OK' }
                    ].map(api => (
                      <div key={api.name} class="flex items-center justify-between p-3 rounded bg-slate-950 border border-slate-800">
                        <span class="text-slate-300">{api.name}</span>
                        <span class="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                          {api.status} ({api.code})
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                <div class="p-5 rounded-xl bg-slate-900 border border-slate-800 space-y-4">
                  <h3 class="font-bold text-white text-sm">Freight Cost Benchmark</h3>
                  <div class="space-y-3">
                    <div class="p-3 rounded bg-slate-950 border border-slate-800 flex justify-between items-center">
                      <span class="text-xs text-slate-400">Rail Freight Spine</span>
                      <span class="text-sm font-bold text-cyan-400 font-mono">₹1.50 - ₹1.96 / tonne-km</span>
                    </div>
                    <div class="p-3 rounded bg-slate-950 border border-slate-800 flex justify-between items-center">
                      <span class="text-xs text-slate-400">Standard Road Freight</span>
                      <span class="text-sm font-bold text-rose-400 font-mono">₹2.80 - ₹3.78 / tonne-km</span>
                    </div>
                    <div class="p-3 rounded bg-cyan-950/30 border border-cyan-500/30 flex justify-between items-center">
                      <span class="text-xs text-cyan-300 font-semibold">Dual-Layer Cost Savings</span>
                      <span class="text-sm font-bold text-emerald-400 font-mono">~42.8% Reduction</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Impact & ROI Tab */}
            {activeTab === 'impact' && (
              <div class="p-6 rounded-xl bg-slate-900 border border-slate-800 space-y-6 text-center">
                <i class="fa-solid fa-leaf text-emerald-400 text-4xl mb-2"></i>
                <h3 class="text-xl font-bold text-white">Sustainability & ROI Projections</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-left">
                  <div class="p-5 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="text-2xl font-bold text-emerald-400 font-mono">31.4%</div>
                    <div class="text-xs text-slate-300 font-semibold mt-1">Carbon Reduction</div>
                    <p class="text-[11px] text-slate-500 mt-2">Shifting long-haul freight from highway diesel trucks to electrified rail corridors.</p>
                  </div>
                  <div class="p-5 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="text-2xl font-bold text-cyan-400 font-mono">38 Mins</div>
                    <div class="text-xs text-slate-300 font-semibold mt-1">Last-Mile ETA Saved</div>
                    <p class="text-[11px] text-slate-500 mt-2">Dedicated median lanes bypass urban signal bottlenecks.</p>
                  </div>
                  <div class="p-5 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="text-2xl font-bold text-amber-400 font-mono">&lt; 14 Mos</div>
                    <div class="text-xs text-slate-300 font-semibold mt-1">Payback Period</div>
                    <p class="text-[11px] text-slate-500 mt-2">Low infrastructure cost via arterial median repurposing.</p>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer class="border-t border-slate-800/80 bg-slate-950 py-3 px-6 text-center text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2">
            <span>Smart India Hackathon 2026 • Problem Statement PS-26205</span>
            <span class="font-semibold text-slate-400">Developed by Team CODE FORCE</span>
            <span class="text-slate-600">Compliance & Telemetry Active</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
